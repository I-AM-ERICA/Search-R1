# 역할: GPU 1대에서 HyperCLOVA 1.5B + 독립 Critic + BM25를 실행하는 첫 실험 설정입니다.
# 예제 데이터 실행용입니다. 실제 실험에서는 세 데이터 경로와 allow_demo를 변경하세요.
model_name: naver-hyperclovax/HyperCLOVAX-SEED-Text-Instruct-1.5B
model_revision: main
seed: 42
load_in_4bit: true
lora_rank: 8
lora_alpha: 16
gradient_checkpointing: true
corpus_path: data/demo/corpus.jsonl
train_path: data/demo/train.jsonl
val_path: data/demo/val.jsonl
allow_demo: true
retriever: bm25
dense_model: intfloat/multilingual-e5-small
top_k: 3
max_seq_length: 1536
max_prompt_tokens: 512
max_new_tokens: 192
max_observation_tokens: 192
max_searches: 2
rollout_batch_size: 4
total_updates: 10
ppo_epochs: 2
actor_lr: 0.00001
critic_lr: 0.00005
gamma: 1.0
gae_lambda: 0.95
clip_range: 0.2
value_clip_range: 0.2
kl_coef: 0.01
max_grad_norm: 1.0
format_reward: 0.0
search_cost: 0.0
eval_every: 5
save_every: 5
max_zero_signal_updates: 3
output_dir: outputs/first_experiment
